<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="140" fill="#0d0d0d" rx="8"/>

  <!-- Top-left corner bracket -->
  <polyline points="20,30 20,20 30,20" fill="none" stroke="#ff2d78" stroke-width="2"/>
  <!-- Bottom-right corner bracket -->
  <polyline points="870,110 870,120 860,120" fill="none" stroke="#ff2d78" stroke-width="2"/>

  <!-- Prompt line -->
  <text x="36" y="58" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff2d78" opacity="0.7">root@k4os:~$</text>

  <!-- Main name -->
  <text x="36" y="100" font-family="'JetBrains Mono', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">K4os</text>

  <!-- Blinking cursor after name -->
  <rect x="171" y="72" width="22" height="34" fill="#ff2d78" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="36" y="125" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffffff" opacity="0.4" letter-spacing="2">PENETRATION TESTER IN TRAINING  ·  CTF PLAYER  ·  PERPETUAL LEARNER</text>
</svg>
